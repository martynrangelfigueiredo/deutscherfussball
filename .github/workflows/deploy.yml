name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pacote de producao (_site)
        run: |
          test -f "index.html"
          test -f "CNAME"
          mkdir -p _site/rom
          cp index.html CNAME .nojekyll _site/
          if [ -d "rom" ]; then
            cp -r rom/. _site/rom/ 2>/dev/null || true
          fi
          echo "Pacote de produção preparado com sucesso!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
